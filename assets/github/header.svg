<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">Affiliate Agent Skills</title>
  <desc id="desc">Disclosure-first affiliate engineering: a program catalog, an audit of catalog against content and traffic, a disclosure on every page with links, and disclosed commission terms. File-based agent skills.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.55" stop-color="#04060C"/>
      <stop offset="1" stop-color="#02040A"/>
    </linearGradient>

    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8B45A" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#E8B45A" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#E8B45A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6FE3F5" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#6FE3F5" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#6FE3F5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C6D4E6"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.72" stop-color="#E8B45A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panelGlass" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.028"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.012"/>
    </linearGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <circle cx="1362" cy="24" r="430" fill="url(#glowGold)"/>
  <circle cx="128" cy="392" r="380" fill="url(#glowCyan)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>
  <rect x="0" y="0.5" width="1600" height="1" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="0" y="399" width="1600" height="1" fill="#FFFFFF" fill-opacity="0.05"/>

  <g font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
    <g font-size="11.5" letter-spacing="3.1" font-weight="600">
      <circle cx="76" cy="61.5" r="2.6" fill="#6FE3F5"/>
      <text x="90" y="66" fill="#8FA3BC">AGENTIC-INCOME NETWORK</text>
      <text x="1528" y="66" text-anchor="end" fill="#6B7B92" letter-spacing="2.6">OPEN SOURCE &#183; MIT</text>
    </g>

    <text x="71" y="141" font-size="56" font-weight="700" letter-spacing="1.2" fill="url(#ink)">AFFILIATE AGENT SKILLS</text>
    <text x="72" y="181" font-size="21" font-weight="400" letter-spacing="0.1" fill="#93A6BF">Disclosure-first affiliate engineering</text>

    <rect x="72" y="204" width="1456" height="1" fill="url(#rule)"/>

    <g>
      <rect x="72" y="230" width="318" height="94" rx="14" fill="#0A101C" fill-opacity="0.55"/>
      <rect x="72" y="230" width="318" height="94" rx="14" fill="url(#panelGlass)" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <rect x="73" y="230.5" width="316" height="1" fill="url(#sheen)"/>
      <text x="92" y="257" font-size="10.5" letter-spacing="2.4" font-weight="600" fill="#6FE3F5">01</text>
      <text x="92" y="288" font-size="18" font-weight="600" fill="#EDF3FA">Catalog</text>
      <text x="92" y="309" font-size="11" letter-spacing="0.2" fill="#71829A">data/programs.json</text>
    </g>

    <g>
      <rect x="452" y="230" width="318" height="94" rx="14" fill="#0A101C" fill-opacity="0.55"/>
      <rect x="452" y="230" width="318" height="94" rx="14" fill="url(#panelGlass)" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <rect x="453" y="230.5" width="316" height="1" fill="url(#sheen)"/>
      <text x="472" y="257" font-size="10.5" letter-spacing="2.4" font-weight="600" fill="#6FE3F5">02</text>
      <text x="472" y="288" font-size="18" font-weight="600" fill="#EDF3FA">Audit</text>
      <text x="472" y="309" font-size="11" letter-spacing="0.2" fill="#71829A">catalog &#215; content &#215; traffic</text>
    </g>

    <g>
      <rect x="832" y="230" width="318" height="94" rx="14" fill="#0A101C" fill-opacity="0.55"/>
      <rect x="832" y="230" width="318" height="94" rx="14" fill="url(#panelGlass)" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <rect x="833" y="230.5" width="316" height="1" fill="url(#sheen)"/>
      <text x="852" y="257" font-size="10.5" letter-spacing="2.4" font-weight="600" fill="#6FE3F5">03</text>
      <text x="852" y="288" font-size="18" font-weight="600" fill="#EDF3FA">Disclosure</text>
      <text x="852" y="309" font-size="11" letter-spacing="0.2" fill="#71829A">one per page, with links</text>
    </g>

    <g>
      <rect x="1212" y="230" width="318" height="94" rx="14" fill="#0D0E14" fill-opacity="0.6"/>
      <rect x="1212" y="230" width="318" height="94" rx="14" fill="url(#panelGlass)" stroke="#E8B45A" stroke-opacity="0.26"/>
      <rect x="1213" y="230.5" width="316" height="1" fill="url(#sheen)"/>
      <text x="1232" y="257" font-size="10.5" letter-spacing="2.4" font-weight="600" fill="#E8B45A">04</text>
      <text x="1232" y="288" font-size="18" font-weight="600" fill="#F5EEE0">Payout</text>
      <text x="1232" y="309" font-size="11" letter-spacing="0.2" fill="#8C8172">commission terms</text>
    </g>

    <g fill="none" stroke="#6FE3F5" stroke-width="1.4" stroke-linecap="round">
      <path d="M404 277 H440" stroke-opacity="0.42"/>
      <path d="M435 272.5 L440.5 277 L435 281.5" stroke-opacity="0.6"/>
      <path d="M784 277 H820" stroke-opacity="0.42"/>
      <path d="M815 272.5 L820.5 277 L815 281.5" stroke-opacity="0.6"/>
      <path d="M1144 277 H1180" stroke-opacity="0.42"/>
      <path d="M1175 272.5 L1180.5 277 L1175 281.5" stroke-opacity="0.6"/>
    </g>

    <g font-size="11.5" fill="#6E7E96">
      <rect x="72" y="359" width="14" height="1" fill="#E8B45A" fill-opacity="0.7"/>
      <text x="96" y="363.5" letter-spacing="0.2">Catalog &#8594; audit &#8594; disclosure &#8594; commission terms. No earnings are promised here.</text>
      <text x="1528" y="363.5" text-anchor="end" letter-spacing="0.2">File-based skills &#183; no hosted server</text>
    </g>
  </g>
</svg>
